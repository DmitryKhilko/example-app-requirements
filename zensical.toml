[project]
site_name = "Пример организации требований с использованием подхода Docs as Code"
site_description = "Пример организации требований с использованием подхода Documentation as Code"
# ВАЖНО: укажите реальный адрес сайта, иначе instant-навигация и поиск работают некорректно
# Для GitHub Pages: https://dmitrykhilko.github.io/example-app-requirements/
site_url = "https://dmitrykhilko.github.io/example-app-requirements/"
site_author = "Дмитрий Хилько"
# Кнопка «Редактировать страницу» / ссылка на репозиторий (по желанию)
repo_url = "https://github.com/DmitryKhilko/example-app-requirements"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/tiles.js", "javascripts/status-filter.js"]

# --- ТЕМА ---
[project.theme]
language = "ru"
custom_dir = "theme-custom"  # Zensical будет брать стили и скрипты отсюда
# Все возможности включаются ОДНИМ списком внутри [project.theme]
features = [
    # навигация
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    #"navigation.path",          # «хлебные крошки» (вместо неверного navigation.breadcrumbs)
    "navigation.indexes",
    "navigation.top",           # кнопка «Наверх»
    "navigation.footer",        # ссылки «Предыдущая / Следующая» внизу страницы
    "toc.follow",
    # поиск
    "search.suggest",
    "search.highlight",
    "search.share",
    # контент
    "content.code.copy",        # кнопка копирования кода
    "content.code.annotate",
    "content.tooltips",
    "content.action.edit",      # кнопка «Править страницу» (нужны repo_url и edit_uri)
    "content.footnote.tooltips",
    # прочее
    # "header.autohide",
]

[project.theme.font]
text = "Nunito"
code = "Fira Code"

[project.extra.status]
# Статусы фич (поле status в спецификациях, карта фичей), жизненный цикл SDLC
backlog = "Бэклог"
analysis = "Анализ"
ready = "Готово к разработке"
development = "Разработка"
released = "Реализовано"
archived = "Архив"
# Статусы статей базы знаний, не являющихся фичами (например, glossary.md)
draft = "Черновик"
review = "На проверке"
published = "Опубликовано"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Включить тёмную тему"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Включить светлую тему"

# --- Расширения Markdown (подсветка кода, вкладки, примечания, чек-листы) ---
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.abbr]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# Настройки предварительного просмотра страниц
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = ["**/*.md"]
sources.exclude = ["index.md"]

# Отображение иконок эмодзи
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
