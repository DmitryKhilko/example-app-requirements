[project]
site_name = "Пример организации требований с использованием подхода Docs as Code"
site_description = "Пример организации требований с использованием подхода Documentation as Code"
# ВАЖНО: укажите реальный адрес сайта, иначе instant-навигация и поиск работают некорректно
# Для GitHub Pages: https://dmitrykhilko.github.io/example-app-requirements/
site_url = "https://dmitrykhilko.github.io/example-app-requirements/"
site_author = "Дмитрий Хилько"
# Кнопка «Редактировать страницу» / ссылка на репозиторий (по желанию)
repo_url = "https://github.com/DmitryKhilko/example-app-requirements"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/status-filter.js", "javascripts/releases.js"]

# Не публиковать служебные файлы (скрипты, схемы, таксономию)
# exclude_docs = """
#*.py
#*.json
#*.yml
#"""

# Меню сайта формируется скриптом scripts/generate_docs.py: вкладки «Проект», «Реестр требований» и «Релизы»,
# левое меню вкладки — её страницы (названия папок по-русски).
# BEGIN GENERATED NAV — не редактируйте вручную
nav = [
    { "Проект" = [
        { "О продукте" = "project/about.md" },
        { "Глоссарий" = "project/glossary.md" },
        { "Roadmap" = "project/roadmap.md" },
    ] },
    { "Реестр требований" = [
        { "Обзор" = "registry/overview.md" },
        { "Действующие" = [
            "registry/active/index.md",
            { "Каталог товаров" = [
                "registry/active/catalog/index.md",
                "registry/active/catalog/filter-categories.md",
                "registry/active/catalog/filter-price-slider.md",
                "registry/active/catalog/product-gallery.md",
                "registry/active/catalog/product-recommendations.md",
                "registry/active/catalog/search-text.md",
                "registry/active/catalog/new-feature.md",
                "registry/active/catalog/new-feature-copy.md",
            ] },
            { "Управление заказами" = [
                "registry/active/orders/index.md",
                "registry/active/orders/credit-pay.md",
                "registry/active/orders/payment-sbp.md",
                "registry/active/orders/order-cancel.md",
                "registry/active/orders/checkout-map.md",
            ] },
            { "Личный кабинет" = [
                "registry/active/profile/index.md",
                "registry/active/profile/auth-2fa.md",
                "registry/active/profile/auth-sms.md",
                "registry/active/profile/edit-data.md",
                "registry/active/profile/oauth.md",
            ] },
        ] },
        { "Архив" = [
            "registry/archive/index.md",
            { "Каталог товаров" = [
                "registry/archive/catalog/index.md",
                "registry/archive/catalog/search-old.md",
            ] },
            { "Управление заказами" = [
                "registry/archive/orders/index.md",
                "registry/archive/orders/print-receipt.md",
            ] },
            { "Личный кабинет" = [
                "registry/archive/profile/index.md",
                "registry/archive/profile/legacy-cards.md",
            ] },
        ] },
    ] },
    { "Релизы" = "releases.md" },
]
# END GENERATED NAV

# --- ТЕМА ---
[project.theme]
language = "ru"
custom_dir = "theme-custom"  # Zensical будет брать стили и скрипты отсюда
# Все возможности включаются ОДНИМ списком внутри [project.theme]
features = [
    # навигация
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    #"navigation.sections",      # группы в левом меню делает раскрытыми
    "navigation.prune",          # физическое удаление из HTML-кода страницы всех элементов из свёрнутой группы
    "navigation.path",          # «хлебные крошки» (вместо неверного navigation.breadcrumbs)
    "navigation.indexes",
    "navigation.top",           # кнопка «Наверх»
    "navigation.footer",        # ссылки «Предыдущая / Следующая» внизу страницы
    "toc.follow",
    # поиск
    "search.suggest",
    "search.highlight",
    "search.share",
    # контент
    "content.code.copy",        # кнопка копирования кода
    "content.code.annotate",
    "content.tooltips",
    "content.action.edit",      # кнопка «Править страницу» (нужны repo_url и edit_uri)
    "content.footnote.tooltips",
    # прочее
    # "header.autohide",
]

[project.theme.font]
text = "Nunito"
code = "Fira Code"

[project.extra.tracker]
# Адрес задач в трекере: ссылка в «паспорте» спецификации строится как task_url + номер из поля task_id
# (например, "https://github.bmf/khilko/app_requirements/issues/" + "1"). Адрес должен оканчиваться на «/».
task_url = "https://github.bmf/khilko/app_requirements/issues/"

[project.extra.status]
# Статусы фич (поле status в спецификациях, страницы реестра), жизненный цикл SDLC
backlog = "Бэклог"
analysis = "Анализ"
ready = "Готово к разработке"
development = "Разработка"
released = "Реализовано"
archived = "Архив"
# Статусы статей базы знаний, не являющихся фичами (например, glossary.md)
draft = "Черновик"
review = "На проверке"
published = "Опубликовано"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Включить тёмную тему"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Включить светлую тему"

# --- Расширения Markdown (подсветка кода, вкладки, примечания, чек-листы) ---
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.abbr]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# Настройки предварительного просмотра страниц
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = ["**/*.md"]
# Страницы-перечни сами ссылок для предпросмотра не получают: у ссылок на спецификации там явно задан data-preview,
# а кнопки фильтра предпросмотра не нужны. Исключены:
#   * index.md — стартовая страница, индексы подразделов «Действующие» и «Архив» и индексы модулей;
#   * registry/overview.md — страница «Обзор» реестра;
#   * project/about.md — «О продукте» (плитки перехода);
#   * releases.md — «Релизы»: ссылки на спецификации в её блоках открываются без окна предпросмотра.
sources.exclude = ["index.md", "**/index.md", "registry/overview.md", "project/about.md", "releases.md"]

# Отображение иконок эмодзи
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
