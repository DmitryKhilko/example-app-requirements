name: ci

# Срабатывает при каждом слиянии (push) в основную ветку.
# Одно задание, шаги идут подряд в одном окружении (быстрее и надёжнее, чем два задания: один checkout, одна установка пакетов):
#   1) сгенерировать документы (версии и журналы изменений, индексы реестра, меню, релизы, связи) и закоммитить их в main;
#   2) собрать сайт из уже сформированных файлов и опубликовать на GitHub Pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:   # ручной запуск из вкладки Actions

permissions:
  contents: read

# Запрещаем одновременные сборки (если вы сделаете 2 коммита подряд, старый деплой прервется)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: write   # право на push коммита со сгенерированными файлами
      pages: write      # Обязательное разрешение для деплоя Pages
      id-token: write   # Обязательное разрешение для авторизации
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # полная история нужна для версий и журнала изменений (по ней считаются коммиты каждой спецификации)

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc +'%V')" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          key: zensical-toml-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-toml-

      # uv ставится один раз через pip (без сторонних действий), дальше пакеты ставит uv
      - run: python -m pip install uv

      - run: uv pip install --system -r scripts/requirements.txt zensical

      # Падает с ошибкой, если в метаданных спецификаций нет module или feature_name либо файл лежит вне docs/registry/
      # --versioning: пересчитывает doc_version, datetime_version, owner и «Журнал изменений» активных спецификаций по истории git
      # (ссылки на коммиты)
      - name: Generate docs
        run: python scripts/generate_docs.py --versioning

      # Коммит от GITHUB_TOKEN не запускает новый workflow, поэтому цикла не возникает.
      # Метка [skip ci] добавлена как страховка (например, если позже заменить токен на PAT).
      # Если push не удался (например, кто-то успел запушить в main), шаг падает и публикация не выполняется.
      - name: Commit generated docs
        run: |
          if [ -n "$(git status --porcelain docs zensical.toml)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs zensical.toml
            git commit -m "docs: автоматическое обновление версий, журналов изменений, индексов реестра, релизов и меню [skip ci]"
            git push origin HEAD:main
          else
            echo "Сформированные страницы без изменений."
          fi

      # Сборка сайта из рабочей копии, где уже лежат сформированные файлы (Zensical сложит готовый HTML в папку site/)
      - run: zensical build --clean

      # Настройка инфраструктуры Pages внутри контейнера
      - uses: actions/configure-pages@v6

      # Загрузка сгенерированной папки site/ как артефакта сборки
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      # Финальный запуск встроенного деплоя на сервера GitHub
      - id: deployment
        uses: actions/deploy-pages@v5
