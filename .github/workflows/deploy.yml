name: ci

# Срабатывает при каждом слиянии (push) в основную ветку.
# Порядок: 1) обновить карту фичей -> 2) собрать и опубликовать сайт.
on:
  push:
    branches:
      - main
  workflow_dispatch:   # ручной запуск из вкладки Actions

permissions:
  contents: read

# Запрещаем одновременные сборки (если вы сделаете 2 коммита подряд, старый деплой прервется)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Шаг 1. Пересобрать docs/feature-map.md и закоммитить его в main, если он изменился.
  # Коммит от GITHUB_TOKEN не запускает новый workflow, поэтому цикла не возникает.
  # Метка [skip ci] добавлена как страховка (например, если позже заменить токен на PAT).
  # --------------------------------------------------------------------------
  feature-map:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write   # право на push коммита с картой фичей
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Падает с ошибкой, если в метаданных спецификаций нет module или feature_name
      - name: Build feature map
        run: python scripts/build_feature_map.py

      - name: Commit feature map and folder indexes
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "docs: автоматическое обновление карты фичей и индексов папок [skip ci]"
            git push origin HEAD:main
          else
            echo "Изменений в карте фичей нет."
          fi

  # --------------------------------------------------------------------------
  # Шаг 2. Сборка статического сайта и публикация на GitHub Pages.
  # Выполняется после шага 1 и берёт из main уже актуальную карту фичей.
  # --------------------------------------------------------------------------
  deploy:
    needs: feature-map
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Обязательное разрешение для деплоя Pages
      id-token: write   # Обязательное разрешение для авторизации
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main     # последний коммит ветки, включая коммит с картой фичей

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc +'%V')" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          key: zensical-toml-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-toml-

      - run: pip install zensical

      # Сборка сайта (Zensical сложит готовый HTML в папку site/)
      - run: zensical build --clean

      # Настройка инфраструктуры Pages внутри контейнера
      - uses: actions/configure-pages@v6

      # Загрузка сгенерированной папки site/ как артефакта сборки
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      # Финальный запуск встроенного деплоя на сервера GitHub
      - id: deployment
        uses: actions/deploy-pages@v5
